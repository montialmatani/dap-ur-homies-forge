name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Publish log and jar to ci-out branch
        if: always()
        run: |
          mkdir -p /tmp/ci
          cp build.log /tmp/ci/ || true
          grep -E "error:|warning: \\[|What went wrong|FAILED|Exception" build.log > /tmp/ci/summary.txt || true
          cp build/libs/*.jar /tmp/ci/ 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_id }}" > /tmp/ci/RUN.txt
          cd /tmp/ci
          git init -q -b ci-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci output for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-out
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar

  mappings:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Fetch Yarn mappings
        run: |
          mkdir out && cd out
          for v in 1.20.1+build.10 1.21.1+build.3; do
            curl -sSfL -o y.jar "https://maven.fabricmc.net/net/fabricmc/yarn/$v/yarn-$v-mergedv2.jar"
            unzip -p y.jar mappings/mappings.tiny > "yarn-$v.tiny"
          done
          ls -la
      - name: Publish mappings to ci-mappings branch
        run: |
          cd out
          git init -q -b ci-mappings
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "yarn mappings"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-mappings
