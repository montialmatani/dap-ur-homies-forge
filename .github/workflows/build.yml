name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Publish log and jar to ci-out branch
        if: always()
        run: |
          mkdir -p /tmp/ci
          cp build.log /tmp/ci/ || true
          grep -E "error:|warning: \\[|What went wrong|FAILED|Exception" build.log > /tmp/ci/summary.txt || true
          cp build/libs/*.jar /tmp/ci/ 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_id }}" > /tmp/ci/RUN.txt
          cd /tmp/ci
          git init -q -b ci-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci output for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-out
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar

  mappings:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Fetch Yarn mappings
        run: |
          mkdir out && cd out
          for v in 1.20.1+build.10 1.21.1+build.3; do
            curl -sSfL -o y.jar "https://maven.fabricmc.net/net/fabricmc/yarn/$v/yarn-$v-mergedv2.jar"
            unzip -p y.jar mappings/mappings.tiny > "yarn-$v.tiny"
          done
          ls -la
      - name: Publish mappings to ci-mappings branch
        run: |
          cd out
          git init -q -b ci-mappings
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "yarn mappings"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-mappings

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils x11-utils imagemagick > /dev/null
      - name: Prepare run dir
        run: |
          mkdir -p run run-server
          echo "eula=true" > run-server/eula.txt
          printf 'online-mode=false\nlevel-seed=4242\nspawn-protection=0\nlevel-name=world\n' > run-server/server.properties
          printf 'onboardAccessibility:false\ntutorialStep:none\npauseOnLostFocus:false\nnarrator:0\nrenderDistance:6\nsimulationDistance:6\njoinedFirstServer:true\nskipMultiplayerWarning:true\n' > run/options.txt
      - name: Dedicated server smoke test
        run: |
          gradle runServer --no-daemon > server.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log; then echo "server up"; break; fi
            if grep -qE "Crash report|Exception in server tick|MixinApplyError|InvalidInjectionException" server.log; then echo "server error"; break; fi
            sleep 5
          done
          sleep 10
          pkill -TERM -f "net.minecraftforge|dev.architectury|DevLaunchInjector|runServer" || true
          sleep 25
          pkill -KILL -f "net.minecraftforge|dev.architectury|DevLaunchInjector" || true
          ls run-server run-server/world | head -40 || true
      - name: Client smoke test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          mkdir -p run/saves && cp -r run-server/world run/saves/world || true
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          gradle runClient -Psmoke --no-daemon > client.log 2>&1 &
          for i in $(seq 1 180); do
            if grep -qE "SMOKE_DONE|Stopping!" client.log; then echo "client finished"; break; fi
            if grep -qE "Crash report|---- Minecraft Crash Report|MixinApplyError|InvalidInjectionException" client.log; then echo "client error"; sleep 5; break; fi
            if [ $((i % 12)) -eq 0 ]; then import -window root -display :99 "desktop_$i.png" || true; fi
            sleep 5
          done
          import -window root -display :99 desktop_final.png || true
          sleep 15
          pkill -KILL -f "net.minecraftforge|dev.architectury|DevLaunchInjector" || true
      - name: Verify smoke results
        run: |
          grep -q "Done (" server.log || { echo "::error::dedicated server did not start"; exit 1; }
          grep -q "SMOKE_DONE" client.log || { echo "::error::client smoke test did not finish"; exit 1; }
      - name: Publish smoke results to ci-smoke branch
        if: always()
        run: |
          mkdir -p /tmp/smoke
          cp server.log client.log /tmp/smoke/ 2>/dev/null || true
          cp run/screenshots/*.png /tmp/smoke/ 2>/dev/null || true
          cp desktop_*.png /tmp/smoke/ 2>/dev/null || true
          cp -r run/crash-reports /tmp/smoke/ 2>/dev/null || true
          cp run/logs/latest.log /tmp/smoke/client-latest.log 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_id }}" > /tmp/smoke/RUN.txt
          cd /tmp/smoke
          git init -q -b ci-smoke
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "smoke output for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-smoke

  duo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils x11-utils imagemagick > /dev/null
      - name: Prepare server and client dirs
        run: |
          mkdir -p run-server run-Alice run-Bob
          echo "eula=true" > run-server/eula.txt
          printf 'online-mode=false\nlevel-seed=4242\nspawn-protection=0\nlevel-name=world\nenforce-secure-profile=false\n' > run-server/server.properties
          python3 - <<'PY'
          import hashlib, uuid, json
          def off(n):
              h = bytearray(hashlib.md5(("OfflinePlayer:" + n).encode()).digest())
              h[6] = (h[6] & 0x0f) | 0x30
              h[8] = (h[8] & 0x3f) | 0x80
              return str(uuid.UUID(bytes=bytes(h)))
          json.dump([{"uuid": off(n), "name": n, "level": 4, "bypassesPlayerLimit": False} for n in ("Alice", "Bob")], open("run-server/ops.json", "w"))
          PY
          for p in Alice Bob; do
            printf 'onboardAccessibility:false\ntutorialStep:none\npauseOnLostFocus:false\nnarrator:0\nrenderDistance:6\nsimulationDistance:6\njoinedFirstServer:true\nskipMultiplayerWarning:true\n' > run-$p/options.txt
          done
          gradle writeLaunchScripts -Ptrace --no-daemon
          gradle writeLaunchScripts -Pduo=Alice --no-daemon -q
          gradle writeLaunchScripts -Pduo=Bob --no-daemon -q
          ls build/launch-*.sh .gradle/loom-cache/launch.cfg
          head -c 600 build/launch-runClient-Bob.sh; echo
      - name: Two-player dap test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          build/launch-runServer.sh > server.log 2>&1 &
          for i in $(seq 1 120); do grep -q "Done (" server.log && break; sleep 5; done
          grep -q "Done (" server.log || { echo "::error::server did not start"; tail -50 server.log; exit 1; }
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          Xvfb :98 -screen 0 1280x720x24 > /dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 build/launch-runClient-Alice.sh > alice.log 2>&1 &
          sleep 15
          DISPLAY=:98 build/launch-runClient-Bob.sh > bob.log 2>&1 &
          for i in $(seq 1 150); do
            a=$(grep -c "SMOKE_DONE" alice.log 2>/dev/null); b=$(grep -c "SMOKE_DONE" bob.log 2>/dev/null)
            if [ "$a" -ge 1 ] && [ "$b" -ge 1 ]; then echo "both done"; break; fi
            if grep -qE "Minecraft Crash Report|MixinApplyError" alice.log bob.log server.log; then echo "crash"; sleep 5; break; fi
            sleep 5
          done
          sleep 10
          pkill -KILL java || true
          grep -q "SMOKE_DONE" alice.log && grep -q "SMOKE_DONE" bob.log || { echo "::error::duo test did not finish"; exit 1; }
      - name: Publish duo results to ci-duo branch
        if: always()
        run: |
          mkdir -p /tmp/duo
          cp server.log alice.log bob.log /tmp/duo/ 2>/dev/null || true
          cp run-Alice/screenshots/*.png run-Bob/screenshots/*.png /tmp/duo/ 2>/dev/null || true
          mkdir -p /tmp/duo/crash && cp run-Alice/crash-reports/* run-Bob/crash-reports/* run-server/crash-reports/* /tmp/duo/crash/ 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_id }}" > /tmp/duo/RUN.txt
          cd /tmp/duo
          git init -q -b ci-duo
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "duo output for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-duo
