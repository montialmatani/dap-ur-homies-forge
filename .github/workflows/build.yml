name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar

  mappings:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Fetch Yarn mappings
        run: |
          mkdir out && cd out
          for v in 1.20.1+build.10 1.21.1+build.3; do
            curl -sSfL -o y.jar "https://maven.fabricmc.net/net/fabricmc/yarn/$v/yarn-$v-mergedv2.jar"
            unzip -p y.jar mappings/mappings.tiny > "yarn-$v.tiny"
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: mappings
          path: out/*.tiny
