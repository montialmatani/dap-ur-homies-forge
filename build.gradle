plugins {
    id "dev.architectury.loom" version "1.7-SNAPSHOT"
}

version = project.mod_version
group = "com.cooptest"
base { archivesName = "dap-ur-homies-forge-1.20.1" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

loom {
    silentMojangMappingsLicense()
    forge {
        mixinConfigs = [
                "coopmod.mixins.json",
                "coopmoves-shim.mixins.json",
                "coopmoves-anim.mixins.json"
        ]
    }
    mixin {
        defaultRefmapName = "coopmoves.refmap.json"
    }
    runs {
        server {
            runDir "run-server"
            if (project.hasProperty("trace")) {
                vmArgs "-Dcoopmoves.smoke=server"
            }
        }
        client {
            if (project.hasProperty("duo")) {
                runDir "run-${project.duo}"
            }
            if (project.hasProperty("smoke")) {
                vmArgs "-Dcoopmoves.smoke=true"
                programArgs "--quickPlaySingleplayer", "world"
            }
            if (project.hasProperty("duo")) {
                vmArgs "-Dcoopmoves.smoke=duo", "-Dcoopmoves.smoke.role=${project.duo}"
                programArgs "--username", "${project.duo}", "--quickPlayMultiplayer", "localhost:25565"
            }
        }
    }
}

repositories {
    maven { url "https://maven.architectury.dev/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${project.forge_version}"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
    options.compilerArgs << "-Xmaxerrs" << "2000"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE_coopmod")
    from("NOTICE.md")
}

// CI helper: write plain java launch scripts for the run configs, so several game instances
// can run at once without concurrent Gradle builds fighting over Loom's cache lock.
tasks.register("writeLaunchScripts") {
    dependsOn "classes", "configureClientLaunch", "configureLaunch"
    doLast {
        def suffix = project.hasProperty("duo") ? "-" + project.duo : ""
        ["runClient", "runServer"].each { n ->
            def t = tasks.getByName(n)
            def rc = loom.runConfigs.getByName(n == "runClient" ? "client" : "server")
            def java = t.javaLauncher.get().executablePath.asFile.absolutePath
            def realMain = rc.mainClass.get().contains("not been determined") ? "cpw.mods.bootstraplauncher.BootstrapLauncher" : rc.mainClass.get()
            def dli = [
                    "-Dfabric.dli.config=" + file(".gradle/loom-cache/launch.cfg").absolutePath,
                    "-Dfabric.dli.env=" + rc.environment,
                    "-Dfabric.dli.main=" + realMain
            ]
            println "${n}: task main=${t.mainClass.get()} real main=${realMain} env=${rc.environment}"
            def cmd = [java] + t.allJvmArgs + dli + ["-cp", t.classpath.asPath, "net.fabricmc.devlaunchinjector.Main"] + t.args
            def quoted = cmd.collect { "'" + it.toString().replace("'", "'\\''") + "'" }.join(" ")
            def f = file("build/launch-${n}${suffix}.sh")
            f.text = "#!/bin/bash\nmkdir -p '${t.workingDir}'\ncd '${t.workingDir}'\nexec ${quoted}\n"
            f.setExecutable(true)
            println "wrote ${f}"
        }
    }
}
